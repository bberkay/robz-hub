# Sürüm yayınlama: "vX.Y.Z" etiketi gönderilince Windows ve Linux paketleri derlenir ve GitHub sürümüne yüklenir.
#
#   1. Sürüm numarasını üç dosyada aynı yap: package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json
#   2. CHANGELOG.md'ye "## X.Y.Z" başlığıyla notları yaz
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Her dosyanın tek, sabit adı vardır; README ve web sitesindeki ".../releases/latest/download/…" bağlantıları hep en
# son sürümü verir, Robz Hub da kendi güncellemesini aynı dosyalardan alır (catalog.json -> hub.asset ve hub.linux):
#   Windows  RobzHub-Setup.exe
#   Linux    RobzHub-Linux-amd64.deb (Debian, Ubuntu), RobzHub-Linux-x86_64.rpm (Fedora, openSUSE),
#            RobzHub-Linux-amd64.AppImage (diğer bütün dağıtımlar)
# Dosya adlarını değiştirme. GitHub her dosyanın SHA-256 özetini API'de verir; Robz Hub indirdiğini onunla doğrular.

name: Sürüm

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write # sürümden sonra web sitesini yeniden yayınlamak için

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numaraları etiketle aynı mı
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "Etiket $tag; package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo" >&2
            exit 1
          fi
          grep -qx "## $tag" CHANGELOG.md || { echo "CHANGELOG.md içinde '## $tag' başlığı yok" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Kurulum dosyasını adlandır
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/RobzHub-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  linux:
    needs: version
    # Eski bir glibc ile derlenen paket yeni dağıtımlarda da çalışır.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Sistem kitaplıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Paketleri adlandır
        run: |
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          deb=$(ls "$bundle"/deb/*.deb | head -n 1)
          rpm=$(ls "$bundle"/rpm/*.rpm | head -n 1)
          appimage=$(ls "$bundle"/appimage/*.AppImage | head -n 1)
          cp "$deb" out/RobzHub-Linux-amd64.deb
          cp "$rpm" out/RobzHub-Linux-x86_64.rpm
          cp "$appimage" out/RobzHub-Linux-amd64.AppImage
          chmod +x out/*.AppImage
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Özetler ve sürüm notları
        run: |
          cd out
          sha256sum RobzHub-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          awk -v head="## $VERSION" '$0 == head { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > out/notes.md
          test -s out/notes.md
      - name: GitHub sürümünü oluştur
        run: |
          gh release create "$GITHUB_REF_NAME" out/RobzHub-* out/SHA256SUMS.txt \
            --title "Robz Hub $VERSION" --notes-file out/notes.md
      # Bu iş akışının oluşturduğu sürüm başka iş akışlarını kendiliğinden tetiklemez (GitHub kuralı); sitedeki sürüm
      # numarası ve indirme boyutu yeni sürümle güncellensin diye site burada elle yeniden yayınlanır.
      - name: Web sitesini yeniden yayınla
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
