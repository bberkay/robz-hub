name: Web sitesi

# site/ klasöründen siteyi üretir ve GitHub Pages'e yayınlar: https://kutsalkiremitci.github.io/robz-hub/
# Uygulama kartları catalog.json'dan, görseller docs/'tan gelir; ikisi değişince de site yeniden yayınlanır.
on:
  push:
    branches: [main]
    paths: ['site/**', 'catalog.json', 'docs/**', 'ui/assets/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      # Yayına alma adımı, az önce yüklenen paketi GitHub henüz listelemediğinde "No artifacts named github-pages"
      # hatasıyla düşebiliyor (0.1.8 yayınında oldu; site eski sürümde kaldı). Geçici bir durum: biraz bekleyip en çok
      # iki kez yeniden denenir. Son deneme de başarısız olursa iş başarısız sayılır.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Yeniden denemeden önce bekle (30 sn)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry1
        name: Yayına almayı yeniden dene
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Son denemeden önce bekle (2 dk)
        if: steps.retry1.outcome == 'failure'
        run: sleep 120
      - id: retry2
        name: Yayına almayı son kez dene
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
