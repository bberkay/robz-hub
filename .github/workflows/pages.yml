name: Web sitesi

# site/ klasöründen siteyi üretir ve GitHub Pages'e yayınlar: https://kutsalkiremitci.github.io/robz-hub/
# Uygulama kartları catalog.json'dan, görseller docs/'tan gelir; ikisi değişince de site yeniden yayınlanır.
on:
  push:
    branches: [main]
    paths: ['site/**', 'catalog.json', 'docs/**', 'ui/assets/**', 'assets/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
